<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky notes & to-dos List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title-block">
          <h1>Sticky notes & to-dos List</h1>
          <p>Pin your thoughts. Tick your tasks.</p>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button">
          🌙 Dark board
        </button>
      </header>

      <div class="panel">
        <div class="search-box">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search notes and to‑do lists…"
            aria-label="Search notes"
          />
        </div>
        <div class="filters" role="tablist" aria-label="Filter notes">
          <button type="button" data-filter="all" aria-pressed="true">
            All
          </button>
          <button type="button" data-filter="note" aria-pressed="false">
            Notes
          </button>
          <button type="button" data-filter="todo" aria-pressed="false">
            To‑dos
          </button>
        </div>
        <div class="actions">
          <button class="btn-primary" id="addNoteBtn" type="button">
            + Sticky note
          </button>
          <button class="btn-ghost" id="addTodoBtn" type="button">
            + To‑do list
          </button>
        </div>
      </div>

      <div class="board">
        <div class="masonry" id="board"></div>
        <p class="empty-state" id="emptyState" hidden>
          The board's empty. Pin something up ↑
        </p>
      </div>

      <footer class="credits">Saved automatically in this browser.</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
